services:
  postgres:
    image: postgres:16-alpine
    container_name: stream-optimizer-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: stream_optimizer_dev
    ports:
      # Port 5433 to avoid conflict with existing work containers on 5432
      - "5433:5432"
    volumes:
      - stream_optimizer_data:/var/lib/postgresql/data

volumes:
  stream_optimizer_data:
